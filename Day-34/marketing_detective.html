<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg1:#0b0f1a; --bg2:#111726; --panel:#161d30; --panel2:#1b2438;
    --line:#2a3550; --text:#e8edf9; --muted:#8b96b8;
    --accent:#fbbf24; --accent2:#f472b6; --grad:linear-gradient(135deg,#fbbf24,#f472b6);
    --good:#4ade80; --warn:#fb923c; --bad:#fb7185; --info:#60a5fa;
  }
  html[data-theme="light"]{
    --bg1:#f4f6fb; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef1f8;
    --line:#dde3ef; --text:#1c2436; --muted:#5b6785;
    --accent:#d97706; --accent2:#db2777; --grad:linear-gradient(135deg,#d97706,#db2777);
    --good:#16a34a; --warn:#ea580c; --bad:#dc2626; --info:#2563eb;
  }
  html[data-theme="blue"]{
    --bg1:#061426; --bg2:#0a1d33; --panel:#0d2540; --panel2:#0f2c4a;
    --line:#1c3f61; --text:#dceaff; --muted:#7ba3cc;
    --accent:#38bdf8; --accent2:#818cf8; --grad:linear-gradient(135deg,#38bdf8,#818cf8);
    --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, color-mix(in srgb, var(--accent2) 10%, transparent) 0%, transparent 45%),
      var(--bg1);
    color:var(--text); min-height:100vh; transition:background .3s,color .3s;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:230px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--line);
    padding:20px 14px; display:flex; flex-direction:column; gap:4px; transition:background .3s;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px;}
  .brand .logo{
    width:34px;height:34px;border-radius:10px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#1a1200;
  }
  .brand h1{font-size:13.5px;margin:0;}
  .brand .sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    font-size:12.2px; color:var(--muted); cursor:pointer; border:1px solid transparent; transition:all .15s;
  }
  .nav-item .num{
    width:20px;height:20px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:var(--muted);
  }
  .nav-item.active{background:var(--panel2); color:var(--text); border-color:var(--line);}
  .nav-item.active .num{background:var(--grad); color:#1a1200;}
  .nav-item.done .num{background:var(--good); color:#04140f;}
  .nav-item.locked{opacity:.4; cursor:not-allowed;}
  .nav-item:not(.locked):hover{color:var(--text);}

  @media (max-width:960px){
    .sidebar{position:fixed; z-index:60; height:100%; transform:translateX(-100%); transition:transform .25s;}
    .sidebar.open{transform:translateX(0);}
    .mobile-toggle{display:flex !important;}
  }
  .mobile-toggle{
    display:none; position:fixed; top:14px; left:14px; z-index:70; width:38px;height:38px;
    border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  }

  .main{flex:1; min-width:0; padding:26px clamp(16px,4vw,44px); max-width:1220px; margin:0 auto; width:100%;}

  .progress-wrap{margin-bottom:20px;}
  .progress-track{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;border-radius:6px;background:var(--grad);transition:width .4s ease;}
  .progress-label{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;}

  .card{
    background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:16px; padding:22px; margin-bottom:16px; animation:cardIn .4s ease;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
  @keyframes floatIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}

  h2.section-title{font-size:21px;margin:0 0 6px;}
  p.section-sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.55;}
  .fictional-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; padding:4px 10px;
    border-radius:20px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); margin-bottom:14px;
  }

  .btn{
    font-family:inherit; font-size:13px; font-weight:600; padding:10px 18px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; transition:all .15s;
  }
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn.primary{background:var(--grad); border:none; color:#1a1200;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  .btn.ghost{background:transparent;}
  .btn.small{font-size:11px;padding:6px 12px;}
  .actions-row{display:flex; justify-content:space-between; margin-top:10px; gap:10px; flex-wrap:wrap;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tab-btn{
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel2); color:var(--muted); cursor:pointer; transition:all .15s;
  }
  .tab-btn.active{background:var(--grad); color:#1a1200; border-color:transparent;}
  .tab-btn:hover:not(.active){border-color:var(--accent); color:var(--text);}

  .briefing-box{
    background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:6px;
  }
  .briefing-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
  .briefing-row:last-child{border-bottom:none;}
  .briefing-row b{color:var(--text);}
  .briefing-row span:first-child{color:var(--muted);}

  .metric-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:760px){.metric-grid{grid-template-columns:repeat(2,1fr);}}
  .metric-card{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .metric-card .ml{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .metric-card .mv{font-size:22px;font-weight:800;margin-top:6px;}

  .bars{display:flex; align-items:flex-end; gap:10px; height:140px; margin-top:16px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .bar-fill{width:100%; border-radius:6px 6px 0 0; transition:height .5s ease;}
  .bar-lbl{font-size:10px; color:var(--muted);}
  .bar-val{font-size:10.5px; font-weight:700;}

  .channel-row{
    display:grid; grid-template-columns:120px 1fr 60px 60px; gap:12px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:12px;
  }
  .channel-row:last-child{border-bottom:none;}
  .channel-track{height:10px; border-radius:6px; background:var(--bg2); overflow:hidden; position:relative;}
  .channel-fill-alloc{position:absolute; top:0; left:0; height:100%; background:var(--info); opacity:.35;}
  .channel-fill-spent{position:absolute; top:0; left:0; height:100%; background:var(--accent);}

  .feedback-quote{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
    border-left:4px solid var(--muted);
  }
  .feedback-quote.pos{border-left-color:var(--good);}
  .feedback-quote.neg{border-left-color:var(--bad);}
  .feedback-quote .fq-text{font-size:13px; font-style:italic; margin-bottom:6px;}
  .feedback-quote .fq-meta{font-size:10.5px; color:var(--muted); display:flex; justify-content:space-between;}

  .sentiment-bar{display:flex; height:14px; border-radius:8px; overflow:hidden; margin:12px 0 6px; border:1px solid var(--line);}

  .clue-pool{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .clue-chip{
    background:var(--panel2); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px;
    font-size:11.5px; cursor:grab; max-width:260px; transition:transform .15s, border-color .15s, opacity .15s;
    animation:floatIn .3s ease;
  }
  .clue-chip:hover{border-color:var(--accent); transform:translateY(-2px);}
  .clue-chip.placed{opacity:.3; cursor:not-allowed;}
  .clue-chip .cc-src{font-size:9.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; font-weight:700;}

  .drop-zone{
    min-height:140px; border:2px dashed var(--line); border-radius:14px; padding:16px;
    background:var(--panel2); display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start;
    transition:border-color .2s, background .2s;
  }
  .drop-zone.drag-over{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--panel2));}
  .drop-zone .empty-hint{color:var(--muted); font-size:12.5px; margin:auto;}
  .board-chip{
    background:var(--bg2); border:1.5px solid var(--accent); border-radius:10px; padding:10px 14px;
    font-size:11.5px; display:flex; align-items:center; gap:8px; animation:popIn .25s ease;
  }
  .board-chip .rm{cursor:pointer; color:var(--bad); font-weight:800;}

  .hypothesis-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (max-width:700px){.hypothesis-grid{grid-template-columns:1fr;}}
  .hyp-card{
    background:var(--panel2); border:1.5px solid var(--line); border-radius:14px; padding:16px; cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .hyp-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .hyp-card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .hyp-card h4{margin:0 0 6px; font-size:13.5px;}
  .hyp-card p{margin:0; font-size:11.5px; color:var(--muted); line-height:1.4;}

  .verdict-box{
    background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px;
  }
  .verdict-box.correct{border-color:var(--good);}
  .verdict-box.incorrect{border-color:var(--bad);}

  .score-ring{
    width:120px;height:120px;border-radius:50%;
    background:conic-gradient(var(--ring-color) calc(var(--pct)*1%), var(--panel2) 0);
    display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
  }
  .score-ring::before{content:''; position:absolute; inset:9px; border-radius:50%; background:var(--panel);}
  .score-ring span{position:relative; font-size:24px; font-weight:800;}

  .report-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
  .report-row:last-child{border-bottom:none;}

  .tip-item{
    background:var(--panel2); border-left:3px solid var(--accent); border-radius:8px; padding:12px 14px;
    font-size:12.5px; color:var(--text); margin-bottom:10px; line-height:1.5;
  }

  .welcome-hero{text-align:center; padding:36px 10px 16px;}
  .welcome-hero .logo-big{
    width:70px;height:70px;border-radius:20px;background:var(--grad); margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1a1200;
  }
  .welcome-hero h1{font-size:clamp(22px,5vw,34px); margin:0 0 10px;}
  .welcome-hero p{color:var(--muted); font-size:14px; max-width:560px; margin:0 auto 24px; line-height:1.6;}
  .feature-strip{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px;}
  .feature-pill{background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:11px; color:var(--muted);}

  .theme-card{
    background:var(--panel2); border:1.5px solid var(--line); border-radius:14px; padding:18px;
    cursor:pointer; transition:transform .15s, border-color .15s; text-align:center;
  }
  .theme-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .theme-card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .theme-swatch{width:100%;height:50px;border-radius:10px;margin-bottom:10px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:700px){.grid-3{grid-template-columns:1fr;}}

  .disclaimer-box{
    background:color-mix(in srgb, var(--warn) 12%, transparent); border:1px solid var(--warn);
    border-radius:12px; padding:11px 15px; font-size:12px; color:var(--text); line-height:1.5; margin-bottom:16px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   FICTIONAL CASE GENERATOR — everything invented for education
   ============================================================ */
const BUSINESS_NAMES = [
  "BrightLeaf Tea Co.", "Pulse Fitness App", "Nimbus Cloud Storage", "Ford & Fable Bookstore",
  "Zestly Snacks", "Voltando E-Scooters", "Marble & Co. Furniture", "GreenRoute Bikes",
  "Amberlight Skincare", "Fernway Outdoor Gear",
];

const CHANNEL_NAMES = ["Social Media", "Search Ads", "Email", "Influencer", "Display Ads", "TV/Radio"];

const CAUSES = [
  { id:"audience_mismatch", title:"Wrong Audience Targeting", desc:"The campaign reached people who were unlikely to want the product, wasting spend on low-intent viewers." },
  { id:"budget_misallocation", title:"Budget Misallocated Across Channels", desc:"Money was concentrated in a channel with poor ROI while a stronger-performing channel was under-funded." },
  { id:"weak_creative", title:"Weak Creative / Messaging", desc:"The ads or content failed to capture attention or communicate value, leading to low engagement." },
  { id:"bad_timing", title:"Poor Campaign Timing", desc:"The campaign launched at a time misaligned with customer buying behavior or a competing event." },
  { id:"ignored_feedback", title:"Ignored Early Customer Feedback", desc:"Warning signs from early customer feedback were not acted upon before scaling the campaign." },
  { id:"tracking_error", title:"Broken Tracking / Attribution", desc:"Faulty analytics setup misreported real performance, leading to decisions based on bad data." },
];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){ return [...arr].sort(()=>Math.random()-0.5).slice(0,n); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function generateCase(){
  const business = pick(BUSINESS_NAMES);
  const goal = pick(["Increase Sign-Ups", "Boost Product Sales", "Drive App Downloads", "Grow Newsletter List"]);
  const actualCause = pick(CAUSES);
  const budgetTotal = randInt(20000, 80000);

  // ---- Budget data: 4 channels used, allocation/spend/roi shaped around actualCause ----
  const usedChannels = pickN(CHANNEL_NAMES, 4);
  const overspendChannel = usedChannels[0];
  const underfundedChannel = usedChannels[1];
  const budget = usedChannels.map((ch, i) => {
    let allocatedPct, spentPct, roi;
    if(actualCause.id === "budget_misallocation" && ch === overspendChannel){
      allocatedPct = randInt(45,60); spentPct = allocatedPct + randInt(5,15); roi = randInt(5,25);
    } else if(actualCause.id === "budget_misallocation" && ch === underfundedChannel){
      allocatedPct = randInt(5,12); spentPct = allocatedPct; roi = randInt(60,90);
    } else {
      allocatedPct = randInt(15,30); spentPct = allocatedPct + randInt(-5,8); roi = randInt(30,65);
    }
    return { channel:ch, allocatedPct, spentPct:Math.max(3,spentPct), roi };
  });

  // ---- Audience data ----
  const targetAge = pick(["18–24","25–34","35–44","45–60"]);
  const offTargetAge = pick(["45–60","55–70","18–24","25–34"].filter(a=>a!==targetAge));
  const mismatchPct = actualCause.id === "audience_mismatch" ? randInt(50,68) : randInt(8,22);
  const audience = {
    targetAge,
    targetInterests: pick(["eco-conscious living","fitness & wellness","tech early adopters","budget-conscious families","home & lifestyle"]),
    actualReachAge: actualCause.id === "audience_mismatch" ? offTargetAge : targetAge,
    mismatchPct,
  };

  // ---- Customer feedback ----
  const feedbackPool = [
    { text:"Loved the product once I found it, but I almost didn't understand what it was from the ad.", sentiment:"negative", tag:"messaging" },
    { text:"I saw this ad way too many times and it started to feel spammy.", sentiment:"negative", tag:"frequency" },
    { text:"This doesn't really apply to someone in my age group.", sentiment:"negative", tag:"audience" },
    { text:"Great value, I'll definitely be a repeat customer!", sentiment:"positive", tag:"quality" },
    { text:"I mentioned to support three weeks ago that the signup form was confusing, still hasn't been fixed.", sentiment:"negative", tag:"feedback_ignored" },
    { text:"Fast shipping and the product matched the description perfectly.", sentiment:"positive", tag:"quality" },
    { text:"Not sure why I'm seeing this — I don't think it's for people like me.", sentiment:"negative", tag:"audience" },
    { text:"The messaging felt generic, nothing made me want to click.", sentiment:"negative", tag:"messaging" },
  ];
  let feedback = pickN(feedbackPool, 5);
  if(actualCause.id === "ignored_feedback" && !feedback.some(f=>f.tag==="feedback_ignored")){
    feedback[0] = feedbackPool.find(f=>f.tag==="feedback_ignored");
  }
  if(actualCause.id === "audience_mismatch"){
    feedback = feedback.map((f,i) => i<2 ? feedbackPool.find(x=>x.tag==="audience") : f);
  }
  if(actualCause.id === "weak_creative"){
    feedback = feedback.map((f,i) => i<2 ? feedbackPool.find(x=>x.tag==="messaging") : f);
  }
  const negPct = Math.round((feedback.filter(f=>f.sentiment==="negative").length / feedback.length) * 100);

  // ---- Engagement metrics (4-week trend) ----
  const baseCtr = actualCause.id === "weak_creative" ? randInt(6,12) : randInt(18,32);
  const ctrTrend = [baseCtr, baseCtr-randInt(1,3), baseCtr-randInt(2,5), baseCtr-randInt(3,7)].map(v=>Math.max(2,v));
  const conversionRate = actualCause.id === "tracking_error" ? randInt(1,3) : randInt(4,9);
  const bounceRate = actualCause.id === "weak_creative" ? randInt(60,78) : randInt(35,55);
  const trackingGlitch = actualCause.id === "tracking_error";

  // ---- Sales performance (4-week trend) ----
  const baseSales = randInt(8000,15000);
  let salesTrend;
  if(actualCause.id === "bad_timing"){
    salesTrend = [Math.round(baseSales*0.5), Math.round(baseSales*0.6), Math.round(baseSales*1.4), Math.round(baseSales*1.1)];
  } else {
    salesTrend = [baseSales, Math.round(baseSales*0.85), Math.round(baseSales*0.7), Math.round(baseSales*0.55)];
  }

  // ---- Clues (tagged to a cause id; used in drag-and-drop board) ----
  const overChannelData = budget.find(b=>b.channel===overspendChannel);
  const underChannelData = budget.find(b=>b.channel===underfundedChannel);
  const clues = [
    { id:"c1", src:"Budget", text:`${overChannelData.channel} received ${overChannelData.allocatedPct}% of budget but only delivered ${overChannelData.roi}% ROI.`, cause:"budget_misallocation" },
    { id:"c2", src:"Budget", text:`${underChannelData.channel} got just ${underChannelData.allocatedPct}% of budget despite ${underChannelData.roi}% ROI.`, cause:"budget_misallocation" },
    { id:"c3", src:"Audience", text:`${audience.mismatchPct}% of ad impressions reached the ${audience.actualReachAge} age group instead of the target ${audience.targetAge}.`, cause:"audience_mismatch" },
    { id:"c4", src:"Audience", text:`Target interest profile was "${audience.targetInterests}" but reach skewed toward unrelated segments.`, cause:"audience_mismatch" },
    { id:"c5", src:"Feedback", text: feedback.find(f=>f.tag==="feedback_ignored") ? "A customer flagged a signup issue 3 weeks before launch scale-up; it was never addressed." : "Feedback volume was moderate with no major unresolved complaints.", cause:"ignored_feedback" },
    { id:"c6", src:"Feedback", text:`${negPct}% of sampled feedback was negative, several citing messaging that didn't resonate.`, cause:"weak_creative" },
    { id:"c7", src:"Engagement", text:`Click-through rate opened at ${ctrTrend[0]}% and fell to ${ctrTrend[3]}% by week 4.`, cause:"weak_creative" },
    { id:"c8", src:"Engagement", text:`Bounce rate averaged ${bounceRate}%, ${bounceRate>60?"well above":"near"} typical benchmarks for this channel mix.`, cause:"weak_creative" },
    { id:"c9", src:"Engagement", text: trackingGlitch ? `Conversion rate logged at only ${conversionRate}% despite sales data showing real purchases — a mismatch suggesting a tracking gap.` : `Conversion rate held steady around ${conversionRate}% across the campaign.`, cause:"tracking_error" },
    { id:"c10", src:"Sales", text: actualCause.id==="bad_timing" ? `Sales dipped early but rebounded sharply in week 3, aligning with a seasonal buying window the launch initially missed.` : `Sales trended downward from $${salesTrend[0].toLocaleString()} in week 1 to $${salesTrend[3].toLocaleString()} in week 4.`, cause:"bad_timing" },
  ];

  return {
    id: Date.now() + Math.random(),
    business, goal, budgetTotal, budget, audience, feedback, negPct,
    engagement: { ctrTrend, conversionRate, bounceRate, trackingGlitch },
    salesTrend, actualCause, clues,
  };
}

const LEARNING_TIPS = {
  audience_mismatch: [
    "Always validate targeting parameters against real reach data early in a campaign, not just at setup.",
    "A mismatch between intended and actual audience often shows up first in engagement quality, not just volume.",
  ],
  budget_misallocation: [
    "Track ROI per channel continuously — allocation should follow performance, not just historical habit.",
    "A channel with a small budget share but strong ROI is often a sign you should shift spend toward it.",
  ],
  weak_creative: [
    "Declining CTR alongside high bounce rate is a strong signal the message isn't resonating, not that the audience is wrong.",
    "Test creative variations early and often — messaging fatigue can set in faster than teams expect.",
  ],
  bad_timing: [
    "Compare campaign launch timing against known seasonal or behavioral patterns in your category.",
    "A dip-then-recovery sales pattern often points to timing rather than a fundamentally broken campaign.",
  ],
  ignored_feedback: [
    "Early customer feedback, even a small number of reports, deserves triage before scaling a campaign.",
    "Build a lightweight feedback-to-action loop so signals don't sit unresolved for weeks.",
  ],
  tracking_error: [
    "Cross-check analytics-reported conversions against actual sales or order data periodically.",
    "A gap between reported metrics and real outcomes should be investigated before trusting the dashboard.",
  ],
};

/* ============================================================
   STEP CONFIG
   ============================================================ */
const STEPS = [
  { key:"welcome", label:"Welcome" },
  { key:"theme", label:"Theme Selection" },
  { key:"briefing", label:"Case Briefing" },
  { key:"evidence", label:"Evidence Board" },
  { key:"clueboard", label:"Clue Board" },
  { key:"hypothesis", label:"Hypothesis Builder" },
  { key:"expert", label:"Expert Explanation" },
  { key:"report", label:"Learning Report" },
];

const EVIDENCE_TABS = ["Budget", "Audience", "Feedback", "Engagement", "Sales"];

/* ============================================================
   MAIN APP
   ============================================================ */
function App(){
  const [theme, setTheme] = useState("dark");
  const [stepIndex, setStepIndex] = useState(0);
  const [maxUnlocked, setMaxUnlocked] = useState(0);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [caseData, setCaseData] = useState(() => generateCase());
  const [evidenceTab, setEvidenceTab] = useState("Budget");
  const [boardClueIds, setBoardClueIds] = useState([]);
  const [selectedHypothesis, setSelectedHypothesis] = useState(null);
  const [score, setScore] = useState(null);
  const [dragOverBoard, setDragOverBoard] = useState(false);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  const currentKey = STEPS[stepIndex].key;

  function goTo(i){ if(i <= maxUnlocked){ setStepIndex(i); setSidebarOpen(false); } }
  function next(){ const n = Math.min(stepIndex+1, STEPS.length-1); setStepIndex(n); setMaxUnlocked(m=>Math.max(m,n)); setSidebarOpen(false); }
  function back(){ setStepIndex(Math.max(stepIndex-1,0)); setSidebarOpen(false); }

  function canProceed(){
    if(currentKey === "clueboard") return boardClueIds.length >= 2;
    if(currentKey === "hypothesis") return !!selectedHypothesis;
    return true;
  }

  function onDropClue(clueId){
    setBoardClueIds(ids => ids.includes(clueId) ? ids : [...ids, clueId]);
    setDragOverBoard(false);
  }
  function removeClue(clueId){
    setBoardClueIds(ids => ids.filter(id => id !== clueId));
  }

  function submitHypothesis(){
    const boardClues = caseData.clues.filter(c => boardClueIds.includes(c.id));
    const correctClues = boardClues.filter(c => c.cause === caseData.actualCause.id).length;
    const clueAccuracy = boardClues.length ? correctClues / boardClues.length : 0;
    const hypothesisCorrect = selectedHypothesis === caseData.actualCause.id;
    const finalScore = Math.round((hypothesisCorrect ? 60 : 0) + clueAccuracy * 40);
    setScore({ finalScore, hypothesisCorrect, correctClues, totalBoardClues: boardClues.length });
    next();
  }

  function replayNewCase(){
    const fresh = generateCase();
    setCaseData(fresh);
    setBoardClueIds([]);
    setSelectedHypothesis(null);
    setScore(null);
    setEvidenceTab("Budget");
    setStepIndex(2);
    setMaxUnlocked(2);
  }

  const progressPct = Math.round((stepIndex) / (STEPS.length-1) * 100);

  return (
    <div className="app">
      <div className="mobile-toggle" onClick={()=>setSidebarOpen(o=>!o)}>☰</div>
      <div className={"sidebar" + (sidebarOpen ? " open" : "")}>
        <div className="brand">
          <div className="logo">MD</div>
          <div><h1>Marketing Detective</h1><div className="sub">Case Investigation</div></div>
        </div>
        {STEPS.map((s,i) => (
          <div key={s.key}
            className={"nav-item " + (i===stepIndex ? "active " : "") + (i<stepIndex ? "done " : "") + (i>maxUnlocked ? "locked" : "")}
            onClick={()=>goTo(i)}>
            <span className="num">{i < stepIndex ? "✓" : i+1}</span>
            <span>{s.label}</span>
          </div>
        ))}
      </div>

      <div className="main">
        <div className="progress-wrap">
          <div className="progress-track"><div className="progress-fill" style={{width:progressPct+"%"}}></div></div>
          <div className="progress-label"><span>Step {stepIndex+1} of {STEPS.length}</span><span>{progressPct}% complete</span></div>
        </div>

        {currentKey !== "welcome" && (
          <div className="disclaimer-box">⚠️ Fictional training simulation: this campaign, business, and all data are invented for educational practice.</div>
        )}

        {currentKey === "welcome" && <WelcomeScreen onStart={next} />}
        {currentKey === "theme" && <ThemeScreen theme={theme} setTheme={setTheme} />}
        {currentKey === "briefing" && <BriefingScreen caseData={caseData} />}
        {currentKey === "evidence" && (
          <EvidenceScreen caseData={caseData} tab={evidenceTab} setTab={setEvidenceTab} />
        )}
        {currentKey === "clueboard" && (
          <ClueBoardScreen
            caseData={caseData}
            boardClueIds={boardClueIds}
            onDropClue={onDropClue}
            removeClue={removeClue}
            dragOverBoard={dragOverBoard}
            setDragOverBoard={setDragOverBoard}
          />
        )}
        {currentKey === "hypothesis" && (
          <HypothesisScreen
            selectedHypothesis={selectedHypothesis}
            setSelectedHypothesis={setSelectedHypothesis}
            onSubmit={submitHypothesis}
          />
        )}
        {currentKey === "expert" && (
          <ExpertScreen caseData={caseData} score={score} selectedHypothesis={selectedHypothesis} boardClueIds={boardClueIds} />
        )}
        {currentKey === "report" && (
          <ReportScreen caseData={caseData} score={score} onReplay={replayNewCase} />
        )}

        {currentKey !== "welcome" && currentKey !== "expert" && currentKey !== "report" && (
          <div className="actions-row">
            <button className="btn ghost" onClick={back} disabled={stepIndex===0}>← Back</button>
            {currentKey === "hypothesis" ? (
              <button className="btn primary" onClick={submitHypothesis} disabled={!canProceed()}>Submit Hypothesis →</button>
            ) : (
              <button className="btn primary" onClick={next} disabled={!canProceed()}>Continue →</button>
            )}
          </div>
        )}
        {currentKey === "expert" && (
          <div className="actions-row">
            <button className="btn ghost" onClick={back}>← Back</button>
            <button className="btn primary" onClick={next}>View Learning Report →</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   SCREENS
   ============================================================ */
function WelcomeScreen({ onStart }){
  return (
    <div className="card welcome-hero">
      <div className="logo-big">🕵️</div>
      <h1>Marketing Detective</h1>
      <p>A fictional marketing campaign has underperformed — or overperformed — and it's your job to investigate.
      Examine budget, audience, feedback, and performance data, gather clues, build a hypothesis, and see how your
      detective work compares to the real root cause.</p>
      <div className="feature-strip">
        <span className="feature-pill">📋 Evidence Board</span>
        <span className="feature-pill">🧩 Drag-and-Drop Clues</span>
        <span className="feature-pill">🔍 Root Cause Investigation</span>
        <span className="feature-pill">📊 Learning Report</span>
      </div>
      <button className="btn primary" onClick={onStart} style={{fontSize:"14px",padding:"12px 26px"}}>Start Investigation →</button>
    </div>
  );
}

function ThemeScreen({ theme, setTheme }){
  const themes = [
    { key:"light", title:"Light", swatch:"linear-gradient(135deg,#f4f6fb,#dde3ef)" },
    { key:"dark", title:"Dark", swatch:"linear-gradient(135deg,#111726,#1b2438)" },
    { key:"blue", title:"Blue", swatch:"linear-gradient(135deg,#0a1d33,#1c3f61)" },
  ];
  return (
    <div className="card">
      <h2 className="section-title">Choose Your Theme</h2>
      <p className="section-sub">Pick a visual style for your investigation. You can change this any time.</p>
      <div className="grid-3">
        {themes.map(t => (
          <div key={t.key} className={"theme-card" + (theme===t.key ? " selected" : "")} onClick={()=>setTheme(t.key)}>
            <div className="theme-swatch" style={{background:t.swatch}}></div>
            <div style={{fontWeight:700,fontSize:13}}>{t.title}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function BriefingScreen({ caseData }){
  return (
    <div className="card">
      <h2 className="section-title">Case Briefing</h2>
      <div className="fictional-tag">⚠️ Fictional case, generated for this session</div>
      <p className="section-sub">Here's your case. Review the briefing, then head to the Evidence Board to start investigating.</p>
      <div className="briefing-box">
        <div className="briefing-row"><span>Client</span><b>{caseData.business}</b></div>
        <div className="briefing-row"><span>Campaign Goal</span><b>{caseData.goal}</b></div>
        <div className="briefing-row"><span>Total Budget</span><b>${caseData.budgetTotal.toLocaleString()}</b></div>
        <div className="briefing-row"><span>Channels Used</span><b>{caseData.budget.map(b=>b.channel).join(", ")}</b></div>
        <div className="briefing-row"><span>Case Status</span><b style={{color:"var(--warn)"}}>Under Investigation</b></div>
      </div>
      <p style={{fontSize:"12.5px", color:"var(--muted)", marginTop:"14px", lineHeight:1.6}}>
        The client suspects something went wrong with this campaign but isn't sure what. Your job: examine the evidence,
        collect supporting clues, and form a hypothesis about the real root cause.
      </p>
    </div>
  );
}

function EvidenceScreen({ caseData, tab, setTab }){
  return (
    <div className="card">
      <h2 className="section-title">Campaign Evidence Board</h2>
      <p className="section-sub">Explore each category of evidence. Take note of anything that looks unusual — you'll need it for the Clue Board.</p>
      <div className="tabs">
        {EVIDENCE_TABS.map(t => (
          <button key={t} className={"tab-btn" + (tab===t ? " active" : "")} onClick={()=>setTab(t)}>{t}</button>
        ))}
      </div>
      {tab === "Budget" && <BudgetPanel caseData={caseData} />}
      {tab === "Audience" && <AudiencePanel caseData={caseData} />}
      {tab === "Feedback" && <FeedbackPanel caseData={caseData} />}
      {tab === "Engagement" && <EngagementPanel caseData={caseData} />}
      {tab === "Sales" && <SalesPanel caseData={caseData} />}
    </div>
  );
}

function BudgetPanel({ caseData }){
  return (
    <div>
      <p className="section-sub">Budget Analysis — allocation vs. spend vs. ROI per channel.</p>
      {caseData.budget.map((b,i) => (
        <div key={i} className="channel-row">
          <span>{b.channel}</span>
          <div className="channel-track">
            <div className="channel-fill-alloc" style={{width:b.allocatedPct+"%"}}></div>
            <div className="channel-fill-spent" style={{width:b.spentPct+"%"}}></div>
          </div>
          <span style={{fontSize:11,color:"var(--muted)"}}>{b.spentPct}% spent</span>
          <span style={{fontSize:11, fontWeight:700, color: b.roi<30 ? "var(--bad)" : "var(--good)"}}>{b.roi}% ROI</span>
        </div>
      ))}
      <p style={{fontSize:11,color:"var(--muted)",marginTop:10}}>Blue track = allocated share · Amber fill = actual spend share</p>
    </div>
  );
}

function AudiencePanel({ caseData }){
  const a = caseData.audience;
  return (
    <div>
      <p className="section-sub">Audience Analysis — intended vs. actual reach.</p>
      <div className="metric-grid">
        <div className="metric-card"><div className="ml">Target Age Group</div><div className="mv">{a.targetAge}</div></div>
        <div className="metric-card"><div className="ml">Actual Reach Age</div><div className="mv" style={{color: a.actualReachAge!==a.targetAge ? "var(--bad)":"var(--good)"}}>{a.actualReachAge}</div></div>
        <div className="metric-card"><div className="ml">Target Interest</div><div className="mv" style={{fontSize:14}}>{a.targetInterests}</div></div>
        <div className="metric-card"><div className="ml">Audience Mismatch</div><div className="mv" style={{color: a.mismatchPct>40 ? "var(--bad)":"var(--good)"}}>{a.mismatchPct}%</div></div>
      </div>
    </div>
  );
}

function FeedbackPanel({ caseData }){
  return (
    <div>
      <p className="section-sub">Customer Feedback Analysis — {caseData.negPct}% of sampled feedback is negative.</p>
      <div className="sentiment-bar">
        <div style={{width:caseData.negPct+"%", background:"var(--bad)"}}></div>
        <div style={{width:(100-caseData.negPct)+"%", background:"var(--good)"}}></div>
      </div>
      {caseData.feedback.map((f,i) => (
        <div key={i} className={"feedback-quote " + (f.sentiment==="positive" ? "pos" : "neg")}>
          <div className="fq-text">"{f.text}"</div>
          <div className="fq-meta"><span>Tag: {f.tag.replace('_',' ')}</span><span style={{color:f.sentiment==="positive"?"var(--good)":"var(--bad)"}}>{f.sentiment}</span></div>
        </div>
      ))}
    </div>
  );
}

function EngagementPanel({ caseData }){
  const e = caseData.engagement;
  const maxCtr = Math.max(...e.ctrTrend);
  return (
    <div>
      <p className="section-sub">Engagement Metrics Dashboard — weekly click-through rate trend and key ratios.</p>
      <div className="metric-grid">
        <div className="metric-card"><div className="ml">Conversion Rate</div><div className="mv">{e.conversionRate}%</div></div>
        <div className="metric-card"><div className="ml">Bounce Rate</div><div className="mv" style={{color:e.bounceRate>60?"var(--bad)":"var(--good)"}}>{e.bounceRate}%</div></div>
        <div className="metric-card"><div className="ml">Week 1 CTR</div><div className="mv">{e.ctrTrend[0]}%</div></div>
        <div className="metric-card"><div className="ml">Week 4 CTR</div><div className="mv" style={{color:e.ctrTrend[3]<e.ctrTrend[0]*0.6?"var(--bad)":"var(--good)"}}>{e.ctrTrend[3]}%</div></div>
      </div>
      <div className="bars">
        {e.ctrTrend.map((v,i) => (
          <div key={i} className="bar-col">
            <span className="bar-val">{v}%</span>
            <div className="bar-fill" style={{height:(v/maxCtr*100)+"%", background:"var(--accent)"}}></div>
            <span className="bar-lbl">Wk {i+1}</span>
          </div>
        ))}
      </div>
      {e.trackingGlitch && <p style={{fontSize:11.5,color:"var(--bad)",marginTop:12}}>⚠️ Anomaly: reported conversions seem inconsistent with sales figures.</p>}
    </div>
  );
}

function SalesPanel({ caseData }){
  const maxSales = Math.max(...caseData.salesTrend);
  return (
    <div>
      <p className="section-sub">Sales Performance Chart — weekly revenue trend across the campaign.</p>
      <div className="bars" style={{height:170}}>
        {caseData.salesTrend.map((v,i) => (
          <div key={i} className="bar-col">
            <span className="bar-val">${(v/1000).toFixed(1)}k</span>
            <div className="bar-fill" style={{height:(v/maxSales*100)+"%", background:"var(--accent2)"}}></div>
            <span className="bar-lbl">Wk {i+1}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ClueBoardScreen({ caseData, boardClueIds, onDropClue, removeClue, dragOverBoard, setDragOverBoard }){
  function handleDragStart(e, clueId){
    e.dataTransfer.setData("text/plain", clueId);
  }
  function handleDrop(e){
    e.preventDefault();
    const clueId = e.dataTransfer.getData("text/plain");
    if(clueId) onDropClue(clueId);
  }
  const boardClues = caseData.clues.filter(c => boardClueIds.includes(c.id));
  const poolClues = caseData.clues.filter(c => !boardClueIds.includes(c.id));

  return (
    <div className="card">
      <h2 className="section-title">Drag-and-Drop Clue Board</h2>
      <p className="section-sub">Drag any clues you believe are relevant onto your Evidence Board below. Choose at least 2 to proceed — quality over quantity matters for your score.</p>

      <div className="clue-pool">
        {poolClues.map(c => (
          <div key={c.id} className="clue-chip" draggable onDragStart={(e)=>handleDragStart(e,c.id)}>
            <div className="cc-src">{c.src}</div>
            {c.text}
          </div>
        ))}
        {poolClues.length===0 && <span style={{color:"var(--muted)",fontSize:12.5}}>All clues have been placed on your board.</span>}
      </div>

      <h3 style={{fontSize:14, margin:"18px 0 10px"}}>Your Evidence Board ({boardClues.length} clues)</h3>
      <div
        className={"drop-zone" + (dragOverBoard ? " drag-over" : "")}
        onDragOver={(e)=>{e.preventDefault(); setDragOverBoard(true);}}
        onDragLeave={()=>setDragOverBoard(false)}
        onDrop={handleDrop}
      >
        {boardClues.length===0 && <span className="empty-hint">Drag clues here to build your case…</span>}
        {boardClues.map(c => (
          <div key={c.id} className="board-chip">
            <span>{c.text}</span>
            <span className="rm" onClick={()=>removeClue(c.id)}>✕</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function HypothesisScreen({ selectedHypothesis, setSelectedHypothesis, onSubmit }){
  return (
    <div className="card">
      <h2 className="section-title">Hypothesis Builder</h2>
      <p className="section-sub">Based on the evidence and clues you've gathered, choose the root cause you believe explains this campaign's performance.</p>
      <div className="hypothesis-grid">
        {CAUSES.map(c => (
          <div key={c.id} className={"hyp-card" + (selectedHypothesis===c.id ? " selected" : "")} onClick={()=>setSelectedHypothesis(c.id)}>
            <h4>{c.title}</h4>
            <p>{c.desc}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function ExpertScreen({ caseData, score, selectedHypothesis, boardClueIds }){
  if(!score) return <div className="card"><p>No hypothesis submitted yet.</p></div>;
  const chosen = CAUSES.find(c=>c.id===selectedHypothesis);
  const actual = caseData.actualCause;
  const correct = score.hypothesisCorrect;

  return (
    <div className="card">
      <h2 className="section-title">Expert Explanation</h2>
      <p className="section-sub">Here's how your investigation compares to the actual root cause of this fictional campaign's performance.</p>

      <div className={"verdict-box " + (correct ? "correct" : "incorrect")}>
        <div style={{fontSize:14, fontWeight:700, marginBottom:8, color: correct ? "var(--good)" : "var(--bad)"}}>
          {correct ? "✅ Correct Diagnosis!" : "❌ Not Quite — Here's What Really Happened"}
        </div>
        <p style={{fontSize:12.5, color:"var(--muted)", margin:"0 0 10px"}}>
          Your hypothesis: <b style={{color:"var(--text)"}}>{chosen ? chosen.title : "None selected"}</b>
        </p>
        <p style={{fontSize:12.5, color:"var(--muted)", margin:"0 0 10px"}}>
          Actual root cause: <b style={{color:"var(--text)"}}>{actual.title}</b>
        </p>
        <p style={{fontSize:13, lineHeight:1.6}}>{actual.desc}</p>
      </div>

      <p style={{fontSize:12.5, color:"var(--muted)", marginTop:16}}>
        Of the {score.totalBoardClues} clues on your evidence board, <b style={{color:"var(--text)"}}>{score.correctClues}</b> directly
        supported the actual root cause.
      </p>
    </div>
  );
}

function ReportScreen({ caseData, score, onReplay }){
  if(!score) return <div className="card"><p>Complete the investigation to see your report.</p></div>;
  const tips = LEARNING_TIPS[caseData.actualCause.id] || [];
  const ringColor = score.finalScore >= 80 ? "var(--good)" : score.finalScore >= 50 ? "var(--warn)" : "var(--bad)";

  return (
    <div className="card">
      <h2 className="section-title">Marketing Learning Report</h2>
      <p className="section-sub">A summary of your investigation, score, and key takeaways from this case.</p>

      <div style={{display:"flex", alignItems:"center", gap:22, flexWrap:"wrap", marginBottom:18}}>
        <div className="score-ring" style={{"--pct":score.finalScore, "--ring-color":ringColor}}>
          <span>{score.finalScore}</span>
        </div>
        <div>
          <div style={{fontSize:12.5,color:"var(--muted)"}}>Detective Score</div>
          <div style={{fontSize:18,fontWeight:800,marginTop:4}}>
            {score.finalScore>=80 ? "Master Detective 🕵️" : score.finalScore>=50 ? "Sharp Investigator 🔍" : "Case Still Developing 📋"}
          </div>
        </div>
      </div>

      <div className="report-row"><span>Client</span><b>{caseData.business}</b></div>
      <div className="report-row"><span>Actual Root Cause</span><b>{caseData.actualCause.title}</b></div>
      <div className="report-row"><span>Hypothesis Accuracy</span><b style={{color:score.hypothesisCorrect ? "var(--good)":"var(--bad)"}}>{score.hypothesisCorrect ? "Correct" : "Incorrect"}</b></div>
      <div className="report-row"><span>Relevant Clues Selected</span><b>{score.correctClues} / {score.totalBoardClues}</b></div>

      <h3 style={{fontSize:14, margin:"20px 0 10px"}}>Key Takeaways</h3>
      {tips.map((t,i) => <div key={i} className="tip-item">💡 {t}</div>)}

      <div className="actions-row" style={{marginTop:20}}>
        <span style={{fontSize:12,color:"var(--muted)",alignSelf:"center"}}>Ready for another case?</span>
        <button className="btn primary" onClick={onReplay}>↺ Replay with a New Randomized Case</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
